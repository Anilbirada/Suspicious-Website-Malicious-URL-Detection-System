[project]
name = "suspicious-url-detection-backend"
version = "1.0.0"
description = "Suspicious Website / Malicious URL Detection System Backend API and ML Pipeline"
authors = [
    { name = "Anil Biradar" }
]
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "idna>=3.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
